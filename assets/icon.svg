<!-- The application icon: the letters CA drawn as a cutaway. Both letters
     are solid skin with a panel removed - the C at its shoulder, the A on
     its right leg - and 45-degree section stripes fill the exposed
     interior. The two panels stripe in opposing directions, as adjacent
     parts do in a sectioned engineering drawing.
     The C skin arc from (45.9, 34.4) to (45.9, 65.6) lies on the circle
     centered at (35.05, 50) with radius 19. The shoulder window arc must
     use that same center, or it lands beside the skin band. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <mask id="shoulderWindow">
      <rect width="96" height="96" fill="black"/>
      <path d="M18.6 40.5 A19 19 0 0 1 44.5 33.5" fill="none" stroke="white" stroke-width="8"/>
    </mask>
    <mask id="legWindow">
      <rect width="96" height="96" fill="black"/>
      <path d="M64.7 40 L75.3 72" fill="none" stroke="white" stroke-width="8"/>
    </mask>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="20" fill="#f5f2ea"/>
  <!-- C: solid skin -->
  <path d="M45.9 34.4 A19 19 0 1 0 45.9 65.6" fill="none" stroke="#1a1a1a" stroke-width="12"/>
  <!-- A: solid skin with crossbar -->
  <path d="M44 74 L60 26 L76 74" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="miter"/>
  <line x1="49" y1="57" x2="71" y2="57" stroke="#1a1a1a" stroke-width="7"/>
  <!-- Removed panel on the C's shoulder, stripes leaning down-right -->
  <g mask="url(#shoulderWindow)">
    <rect width="96" height="96" fill="#f5f2ea"/>
    <g stroke="#1a1a1a" stroke-width="1.5">
      <line x1="-30" y1="0" x2="66" y2="96"/>
      <line x1="-25" y1="0" x2="71" y2="96"/>
      <line x1="-20" y1="0" x2="76" y2="96"/>
      <line x1="-15" y1="0" x2="81" y2="96"/>
      <line x1="-10" y1="0" x2="86" y2="96"/>
      <line x1="-5" y1="0" x2="91" y2="96"/>
      <line x1="0" y1="0" x2="96" y2="96"/>
      <line x1="5" y1="0" x2="101" y2="96"/>
      <line x1="10" y1="0" x2="106" y2="96"/>
      <line x1="15" y1="0" x2="111" y2="96"/>
      <line x1="20" y1="0" x2="116" y2="96"/>
      <line x1="25" y1="0" x2="121" y2="96"/>
    </g>
  </g>
  <!-- Removed panel on the A's right leg, stripes leaning down-left -->
  <g mask="url(#legWindow)">
    <rect width="96" height="96" fill="#f5f2ea"/>
    <g stroke="#1a1a1a" stroke-width="1.5">
      <line x1="95" y1="0" x2="-1" y2="96"/>
      <line x1="100" y1="0" x2="4" y2="96"/>
      <line x1="105" y1="0" x2="9" y2="96"/>
      <line x1="110" y1="0" x2="14" y2="96"/>
      <line x1="115" y1="0" x2="19" y2="96"/>
      <line x1="120" y1="0" x2="24" y2="96"/>
      <line x1="125" y1="0" x2="29" y2="96"/>
      <line x1="130" y1="0" x2="34" y2="96"/>
      <line x1="135" y1="0" x2="39" y2="96"/>
      <line x1="140" y1="0" x2="44" y2="96"/>
      <line x1="145" y1="0" x2="49" y2="96"/>
      <line x1="150" y1="0" x2="54" y2="96"/>
      <line x1="155" y1="0" x2="59" y2="96"/>
    </g>
  </g>
</svg>
