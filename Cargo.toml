[workspace]
resolver = "3"
members = [
  "crates/architecture",
  "crates/inspection",
  "crates/comparison",
  "crates/redlining",
  "crates/adapters/git",
  "crates/adapters/treesitter",
  "crates/adapters/gui",
  "crates/cutaway",
  "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
cutaway-architecture = { path = "crates/architecture" }
cutaway-inspection = { path = "crates/inspection" }
cutaway-comparison = { path = "crates/comparison" }
cutaway-redlining = { path = "crates/redlining" }
cutaway-git = { path = "crates/adapters/git" }
cutaway-treesitter = { path = "crates/adapters/treesitter" }
cutaway-gui = { path = "crates/adapters/gui" }

cucumber = "0.23"
eframe = "0.35"
gix = "0.86"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase conventions rather than improve them.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
