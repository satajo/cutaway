[workspace]
resolver = "3"
members = [
  "crates/architecture",
  "crates/inspection",
  "crates/comparison",
  "crates/lenses",
  "crates/planning",
  "crates/adapters/analyzer-go",
  "crates/adapters/analyzer-rust",
  "crates/adapters/gui",
  "crates/adapters/plan-file",
  "crates/adapters/source-git",
  "crates/cutaway",
  "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
cutaway-architecture = { path = "crates/architecture" }
cutaway-inspection = { path = "crates/inspection" }
cutaway-comparison = { path = "crates/comparison" }
cutaway-lenses = { path = "crates/lenses" }
cutaway-planning = { path = "crates/planning" }
cutaway-analyzer-go = { path = "crates/adapters/analyzer-go" }
cutaway-analyzer-rust = { path = "crates/adapters/analyzer-rust" }
cutaway-gui = { path = "crates/adapters/gui" }
cutaway-plan-file = { path = "crates/adapters/plan-file" }
cutaway-source-git = { path = "crates/adapters/source-git" }

cucumber = "0.23"
eframe = "0.35"
gix = "0.86"
pollster = "0.4"
# The portal backend talks to the desktop's file-chooser service over
# D-Bus in pure Rust, so no GTK libraries enter the build closure.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase conventions rather than improve them.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
